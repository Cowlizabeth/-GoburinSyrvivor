
name: Build Goblin Survivor APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and unpack game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          if [ -f project.godot ]; then
            GAME_DIR="$PWD"
          else
            ARCHIVE=$(find . -maxdepth 1 \
              -type f -name '*.zip' \
              | sort -V | tail -n 1)

            if [ -z "$ARCHIVE" ]; then
              echo "ERROR: No game ZIP found"
              exit 1
            fi

            echo "Using archive: $ARCHIVE"
            mkdir -p extracted
            unzip -q -o "$ARCHIVE" -d extracted

            PROJECT=$(find extracted \
              -type f -name project.godot \
              -print -quit)

            if [ -z "$PROJECT" ]; then
              echo "ERROR: project.godot not found"
              exit 1
            fi

            GAME_DIR="$PWD/$(dirname "$PROJECT")"
          fi

          echo "GAME_DIR=$GAME_DIR" >> "$GITHUB_ENV"
          test -f "$GAME_DIR/main.tscn"
          test -f "$GAME_DIR/export_presets.cfg"
          echo "Project found: $GAME_DIR"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://github.com/godotengine/godot/releases/download/4.4.1-stable"

          curl -fL --retry 3 \
            -o /tmp/godot.zip \
            "$BASE/Godot_v4.4.1-stable_linux.x86_64.zip"

          sudo unzip -q /tmp/godot.zip -d /usr/local/bin
          sudo mv \
            /usr/local/bin/Godot_v4.4.1-stable_linux.x86_64 \
            /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          curl -fL --retry 3 \
            -o /tmp/templates.tpz \
            "$BASE/Godot_v4.4.1-stable_export_templates.tpz"

          mkdir -p /tmp/templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"

          unzip -q /tmp/templates.tpz \
            "templates/android_debug.apk" \
            "templates/android_release.apk" \
            "templates/version.txt" \
            -d /tmp/templates

          cp /tmp/templates/templates/* \
            "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

          godot --version

      - name: Configure Android
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.android"

          SETTINGS="$HOME/.config/godot/editor_settings-4.4.tres"

          cat > "$SETTINGS" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure game
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["GAME_DIR"])
          project = root / "project.godot"
          data = project.read_text()

          setting = "textures/vram_compression/import_etc2_astc=true"

          if setting not in data:
              if "[rendering]" in data:
                  data = data.replace(
                      "[rendering]",
                      "[rendering]\n" + setting,
                      1
                  )
              else:
                  data += "\n[rendering]\n" + setting + "\n"

          project.write_text(data)

          preset = root / "export_presets.cfg"
          text = preset.read_text()

          values = {
              "keystore/debug": str(Path.home() / ".android/debug.keystore"),
              "keystore/debug_user": "androiddebugkey",
              "keystore/debug_password": "android",
          }

          for key, value in values.items():
              pattern = r"(?m)^" + re.escape(key) + r"=.*$"
              replacement = key + '="' + value + '"'

              if re.search(pattern, text):
                  text = re.sub(
                      pattern,
                      lambda _: replacement,
                      text
                  )

          preset.write_text(text)
          print("Android settings prepared")
          PY

      - name: Import resources
        shell: bash
        run: |
          set -euo pipefail
          godot --headless \
            --path "$GAME_DIR" \
            --editor --import --quit

      - name: Check scene startup
        shell: bash
        run: |
          set -euo pipefail

          set +e
          timeout 15s godot --headless \
            --path "$GAME_DIR" \
            --quit-after 60 \
            > /tmp/game-check.log 2>&1
          RESULT=$?
          set -e

          cat /tmp/game-check.log

          if grep -E \
            'SCRIPT ERROR|Parse Error|Failed to load|ERROR:' \
            /tmp/game-check.log; then
            echo "Game startup errors detected"
            exit 1
          fi

          if [ "$RESULT" -ne 0 ]; then
            echo "Game startup failed: $RESULT"
            exit 1
          fi

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          godot --headless --verbose \
            --path "$GAME_DIR" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/GoblinSurvivor.apk"

          test -s build/GoblinSurvivor.apk
          unzip -tq build/GoblinSurvivor.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoblinSurvivor-Android
          path: build/GoblinSurvivor.apk
          if-no-files-found: error
          
