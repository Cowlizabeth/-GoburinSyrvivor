
name: Goblin Defense Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find project (also supports uploaded ZIP)
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t projects < <(
            find . -maxdepth 6 -type f \
              -name project.godot \
              -not -path '*/.godot/*' | sort
          )

          if [ ${#projects[@]} -eq 0 ]; then
            mkdir -p /tmp/goblin_source

            mapfile -t archives < <(
              find . -maxdepth 3 -type f \
                -iname '*.zip' -printf '%T@ %p\n' |
              sort -rn | cut -d' ' -f2-
            )

            for archive in "${archives[@]}"; do
              if unzip -Z1 "$archive" |
                grep -Eq '(^|/)project\.godot$'; then
                unzip -qo "$archive" -d /tmp/goblin_source
                break
              fi
            done

            mapfile -t projects < <(
              find /tmp/goblin_source -maxdepth 6 \
                -type f -name project.godot | sort
            )
          fi

          if [ ${#projects[@]} -ne 1 ]; then
            echo "::error::Exactly one Godot project required"
            exit 1
          fi

          dir="$(cd "$(dirname "${projects[0]}")" && pwd)"
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"

          test -f "$dir/export_presets.cfg"
          test -f "$dir/scenes/main.tscn"

          echo "Using project: $dir"

      - name: Android SDK
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail

          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -x "$sdk/cmdline-tools/latest/bin/sdkmanager"

          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" \
            --licenses >/dev/null || true

          "$sdk/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'cmake;3.10.2.4988404' \
            'ndk;23.2.8568313'

          echo "GODOT_CI_ANDROID_SDK=$sdk" >> "$GITHUB_ENV"

      - name: Godot 4.4.1 and Android templates
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail

          version=4.4.1

          wget -q \
            "https://github.com/godotengine/godot/releases/download/${version}-stable/Godot_v${version}-stable_linux.x86_64.zip" \
            -O /tmp/godot.zip

          unzip -qo /tmp/godot.zip -d /tmp

          sudo install -m755 \
            "/tmp/Godot_v${version}-stable_linux.x86_64" \
            /usr/local/bin/godot

          wget -q \
            "https://github.com/godotengine/godot/releases/download/${version}-stable/Godot_v${version}-stable_export_templates.tpz" \
            -O /tmp/templates.tpz

          mkdir -p \
            "$HOME/.local/share/godot/export_templates/${version}.stable" \
            /tmp/godot_templates

          unzip -qo /tmp/templates.tpz -d /tmp/godot_templates

          cp /tmp/godot_templates/templates/* \
            "$HOME/.local/share/godot/export_templates/${version}.stable/"

          test -f \
            "$HOME/.local/share/godot/export_templates/${version}.stable/android_debug.apk"

      - name: Configure editor and debug signing
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PROJECT_DIR/.ci" "$HOME/.android"

          cat > "$PROJECT_DIR/.ci/configure_android.gd" <<'GDSCRIPT'
          extends SceneTree

          func _initialize() -> void:
              var settings: EditorSettings = EditorInterface.get_editor_settings()
              settings.set_setting("export/android/android_sdk_path", OS.get_environment("GODOT_CI_ANDROID_SDK"))
              settings.set_setting("export/android/java_sdk_path", OS.get_environment("JAVA_HOME"))
              print("Android SDK: ", settings.get_setting("export/android/android_sdk_path"))
              print("Java SDK: ", settings.get_setting("export/android/java_sdk_path"))
              quit(0)
          GDSCRIPT

          timeout 75s godot --headless \
            --path "$PROJECT_DIR" \
            --editor \
            --script "$PROJECT_DIR/.ci/configure_android.gd"

          settings_file="$HOME/.config/godot/editor_settings-4.4.tres"

          test -s "$settings_file"

          grep -F 'export/android/android_sdk_path' \
            "$settings_file" || true

          grep -F 'export/android/java_sdk_path' \
            "$settings_file" || true

          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Android Debug,O=Goblin Defense,C=US'

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"

          cat > "$PROJECT_DIR/export_presets.cfg" <<'PRESET'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/GoblinDefense-debug.apk"

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          package/unique_name="org.goblindefense.prototype"
          package/name="Goblin Defense"
          package/version_code=1
          package/version_string="0.1.1"
          package/min_sdk=23
          package/target_sdk=34
          keystore/debug=""
          keystore/debug_user=""
          keystore/debug_password=""
          PRESET

      - name: Import assets
        timeout-minutes: 3
        run: |
          timeout 150s godot --headless \
            --path "$PROJECT_DIR" \
            --editor --import --quit

      - name: Export APK and retain error log
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/build"

          set +e

          timeout 540s godot --headless --verbose \
            --path "$PROJECT_DIR" \
            --export-debug Android \
            "$GITHUB_WORKSPACE/build/GoblinDefense-debug.apk" \
            2>&1 | tee "$GITHUB_WORKSPACE/build/export.log"

          rc=${PIPESTATUS[0]}
          set -e

          if [ "$rc" -ne 0 ]; then
            echo "::error::Godot export failed: $rc"
            exit "$rc"
          fi

          test -s \
            "$GITHUB_WORKSPACE/build/GoblinDefense-debug.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GoblinDefense-APK
          path: build/GoblinDefense-debug.apk
          if-no-files-found: error

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GoblinDefense-export-log
          path: build/export.log
          if-no-files-found: ignore
          
