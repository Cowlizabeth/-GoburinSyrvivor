
name: Goblin Defense Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find or unpack Godot project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t PROJECTS < <(
            find . -maxdepth 6 -type f \
              -name project.godot \
              -not -path '*/.godot/*' | sort
          )

          if [ "${#PROJECTS[@]}" -eq 0 ]; then
            echo "Searching for project ZIP..."

            mapfile -t ZIPS < <(
              find . -maxdepth 3 -type f \
                -iname '*.zip' | sort
            )

            mkdir -p /tmp/goblin_projects

            for archive in "${ZIPS[@]}"; do
              if unzip -Z1 "$archive" |
                grep -Eq '(^|/)project\.godot$'; then
                echo "Extracting: $archive"
                unzip -oq "$archive" \
                  -d /tmp/goblin_projects
                break
              fi
            done

            mapfile -t PROJECTS < <(
              find /tmp/goblin_projects \
                -maxdepth 6 -type f \
                -name project.godot | sort
            )
          fi

          if [ "${#PROJECTS[@]}" -ne 1 ]; then
            echo "::error::Expected one project.godot, found ${#PROJECTS[@]}"
            exit 1
          fi

          PROJECT_DIR="$(
            cd "$(dirname "${PROJECTS[0]}")" && pwd
          )"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/scenes/main.tscn"
          test -f "$PROJECT_DIR/scripts/game.gd"
          test -f "$PROJECT_DIR/export_presets.cfg"
          test -f "$PROJECT_DIR/.ci/configure_android.gd"

          echo "Godot project found: $PROJECT_DIR"

      - name: Configure Android SDK
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

          echo "GODOT_CI_ANDROID_SDK=$SDK" >> "$GITHUB_ENV"

      - name: Install Godot 4.4.1
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail

          VERSION=4.4.1

          wget -q \
            "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_linux.x86_64.zip" \
            -O /tmp/godot.zip

          unzip -q /tmp/godot.zip -d /tmp

          sudo install -m755 \
            "/tmp/Godot_v${VERSION}-stable_linux.x86_64" \
            /usr/local/bin/godot

          wget -q \
            "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_export_templates.tpz" \
            -O /tmp/templates.tpz

          mkdir -p \
            "$HOME/.local/share/godot/export_templates/${VERSION}.stable"

          unzip -q /tmp/templates.tpz \
            -d /tmp/godot_templates

          cp /tmp/godot_templates/templates/* \
            "$HOME/.local/share/godot/export_templates/${VERSION}.stable/"

          godot --headless --version

      - name: Configure Godot Android paths
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail

          test -x "$JAVA_HOME/bin/java"
          test -f "$PROJECT_DIR/.ci/configure_android.gd"

          timeout 90s godot --headless \
            --path "$PROJECT_DIR" \
            --editor \
            --script "$PROJECT_DIR/.ci/configure_android.gd"

          echo "Android paths configured"

      - name: Create debug signing key
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail

          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Goblin Defense,C=US"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import game resources
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail

          timeout 150s godot --headless \
            --path "$PROJECT_DIR" \
            --editor --import --quit

          echo "Resources imported"

      - name: Export Android APK
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/build"

          timeout 540s godot --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/GoblinDefense-debug.apk"

          test -s "$GITHUB_WORKSPACE/build/GoblinDefense-debug.apk"

          echo "APK successfully created"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoblinDefense-Android-APK
          path: build/GoblinDefense-debug.apk
          if-no-files-found: error
          retention-days: 7
          
