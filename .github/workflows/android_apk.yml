
name: Goblin Defense Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Godot project or unpack ZIP
        shell: bash
        run: |
          set -euo pipefail

          if test -f project.godot; then
            project="$PWD"
          else
            project=""
            mkdir -p "$RUNNER_TEMP/goblin_source"

            while IFS= read -r zip; do
              if unzip -Z1 "$zip" |
                grep -Eq '(^|/)project\.godot$'; then

                unzip -q "$zip" \
                  -d "$RUNNER_TEMP/goblin_source"
                break
              fi
            done < <(
              find . -maxdepth 2 -type f \
                -iname '*.zip' \
                -printf '%T@ %p\n' |
              sort -rn | cut -d' ' -f2-
            )

            mapfile -t files < <(
              find "$RUNNER_TEMP/goblin_source" \
                -maxdepth 6 \
                -name project.godot -type f
            )

            if [ "${#files[@]}" -eq 1 ]; then
              project="$(dirname "${files[0]}")"
            fi
          fi

          if [ -z "$project" ] ||
             [ ! -s "$project/project.godot" ]; then
            echo '::error::Godot project not found'
            exit 1
          fi

          for f in \
            project.godot \
            scenes/main.tscn \
            scripts/game.gd \
            export_presets.cfg \
            .ci/configure_android.gd
          do
            if [ ! -s "$project/$f" ]; then
              echo "::error::Missing $f"
              exit 1
            fi
          done

          echo "PROJECT_DIR=$(realpath "$project")" \
            >> "$GITHUB_ENV"

          echo "Godot project located at: $project"

      - name: Install official Android SDK components
        shell: bash
        timeout-minutes: 9
        run: |
          set -euo pipefail

          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"

          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"

          yes | "$manager" \
            --sdk_root="$sdk" \
            --licenses >/dev/null || true

          "$manager" --sdk_root="$sdk" \
            'platform-tools' \
            'build-tools;34.0.0' \
            'platforms;android-34' \
            'cmdline-tools;latest' \
            'cmake;3.10.2.4988404' \
            'ndk;23.2.8568313'

          test -f "$sdk/platform-tools/adb"
          test -f "$sdk/build-tools/34.0.0/aapt2"
          test -f "$sdk/platforms/android-34/android.jar"
          test -d "$sdk/ndk/23.2.8568313"
          test -d "$sdk/cmake/3.10.2.4988404"

          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"

      - name: Install Godot 4.4.1 and matching export templates
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail

          base="https://github.com/godotengine/godot/releases/download/4.4.1-stable"

          curl -fL --retry 3 \
            "$base/Godot_v4.4.1-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"

          unzip -q "$RUNNER_TEMP/godot.zip" \
            -d "$RUNNER_TEMP"

          sudo install -m755 \
            "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" \
            /usr/local/bin/godot

          curl -fL --retry 3 \
            "$base/Godot_v4.4.1-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/templates.tpz"

          mkdir -p \
            "$RUNNER_TEMP/templates" \
            "$HOME/.local/share/godot/export_templates/4.4.1.stable"

          unzip -q "$RUNNER_TEMP/templates.tpz" \
            -d "$RUNNER_TEMP/templates"

          cp "$RUNNER_TEMP/templates/templates/"* \
            "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

          test -s \
            "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"

          godot --headless --version

      - name: Configure Godot paths and signing
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail

          timeout 90s godot --headless \
            --path "$PROJECT_DIR" \
            --editor \
            --script "$PROJECT_DIR/.ci/configure_android.gd"

          cfg="$HOME/.config/godot/editor_settings-4.4.tres"

          test -s "$cfg"

          grep -F \
            "export/android/android_sdk_path" "$cfg"

          grep -F \
            "export/android/java_sdk_path" "$cfg"

          mkdir -p "$HOME/.android"

          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Goblin Defense,O=Debug,C=US'

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" \
            >> "$GITHUB_ENV"

          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' \
            >> "$GITHUB_ENV"

          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' \
            >> "$GITHUB_ENV"

      - name: Import and check Godot scripts
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail

          timeout 180s godot --headless \
            --path "$PROJECT_DIR" \
            --editor --import --quit \
            2>&1 | tee "$RUNNER_TEMP/import.log"

          if grep -E \
            'SCRIPT ERROR:|Parse Error:|Failed to load script' \
            "$RUNNER_TEMP/import.log"; then

            echo '::error::Godot script import error'
            exit 1
          fi

      - name: Export signed debug APK
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/build"

          set +e

          timeout 540s godot --headless --verbose \
            --path "$PROJECT_DIR" \
            --export-debug Android \
            "$GITHUB_WORKSPACE/build/GoblinDefense-debug.apk" \
            2>&1 | tee "$GITHUB_WORKSPACE/build/export.log"

          code=${PIPESTATUS[0]}
          set -e

          if [ "$code" -ne 0 ]; then
            echo "::error::Godot export failed: $code"
            exit 1
          fi

          test -s \
            "$GITHUB_WORKSPACE/build/GoblinDefense-debug.apk"

          unzip -tq \
            "$GITHUB_WORKSPACE/build/GoblinDefense-debug.apk"

          unzip -Z1 \
            "$GITHUB_WORKSPACE/build/GoblinDefense-debug.apk" |
            grep -q '^AndroidManifest.xml$'

          echo "APK archive integrity confirmed"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GoblinDefense-APK
          path: build/GoblinDefense-debug.apk
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GoblinDefense-Failure-Log
          path: build/export.log
          if-no-files-found: ignore
          
